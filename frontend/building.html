<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Building Layout - GIET Campus Guide</title>

    <link rel="icon" type="image/png" href="assets/images/LOGO.png" />
    <link rel="shortcut icon" type="image/png" href="assets/images/LOGO.png" />
    <link rel="apple-touch-icon" href="assets/images/LOGO.png" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Unified CSS Architecture -->
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/building.css" />
</head>
<body>

    <!-- TOP APPLICATION BAR -->
    <header class="app-header">
        <a href="navigation.html" class="btn-nav-link">
            <i class="fa-solid fa-arrow-left"></i> <span>Campus Map</span>
        </a>
        
        <a href="index.html" class="brand-unit">
            <div class="brand-icon-box">
                <img src="assets/images/LOGO.png" alt="GIET Logo" />
            </div>
            <div class="brand-title-wrap">
                <span class="brand-title-main" id="building-header-name">Building Blueprint</span>
                <span class="brand-title-sub">Floor Navigation</span>
            </div>
        </a>

        <!-- DIRECT ADMIN & HOME BUTTONS -->
        <div class="header-tools">
            <button type="button" class="btn-theme-circle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
                <i class="fa-solid fa-moon"></i>
            </button>
            <a href="admin.html" class="btn-nav-link" title="Back to Admin Studio" style="background: rgba(37, 99, 235, 0.15); color: #38bdf8; border-color: rgba(56, 189, 248, 0.4);">
                <i class="fa-solid fa-gear"></i> Admin
            </a>
            <a href="index.html" class="btn-nav-link"><i class="fa-solid fa-house"></i> Home</a>
        </div>
    </header>

    <main class="layout-stage">
        <!-- CONTROLS ROW: BUILDING SELECTOR & SEARCH -->
        <section class="selector-bar">
            <div class="control-item">
                <i class="fa-solid fa-building"></i>
                <select id="building-selector" class="common-select">
                    <!-- Populated dynamically via Database -->
                </select>
            </div>

            <div class="control-item">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="room-search-input" class="common-search-input" placeholder="Search room, corridor, or lab (e.g. CSA-4, CORR-1, BEE LAB)..." autocomplete="off" />
            </div>
        </section>

        <!-- FLOOR SELECTION TABS -->
        <section class="floor-switch-strip" id="floor-tabs-container">
            <!-- Dynamically populated from database floors -->
        </section>

        <!-- BLUEPRINT FRAME -->
        <section class="blueprint-card-frame">
            <div class="frame-top-meta">
                <span id="current-floor-label" class="floor-title-display">CSA Block - Third Floor</span>
                <div class="legend-group">
                    <span class="legend-badge"><span class="legend-dot dot-class"></span> Classroom</span>
                    <span class="legend-badge"><span class="legend-dot dot-lab"></span> Laboratory</span>
                    <span class="legend-badge"><span class="legend-dot dot-office"></span> Office</span>
                    <span class="legend-badge"><span class="legend-dot" style="background: #f59e0b;"></span> Stairs/Lift</span>
                    <span class="legend-badge"><span class="legend-dot" style="background: #94a3b8; border: 1px dashed #fff;"></span> Corridor</span>
                    <span class="legend-badge"><span class="legend-dot dot-utility"></span> Washroom/Water</span>
                </div>
            </div>

            <!-- SCROLLABLE ARCHITECTURAL BOARD -->
            <div class="blueprint-canvas-scroll">
                <div id="blueprint-board" class="blueprint-grid-board">
                    <!-- Rooms rendered from DB coordinates (x, y, w, h) -->
                </div>
            </div>
        </section>

        <!-- ROOM INFORMATION INSPECTOR CARD -->
        <section id="room-detail-card" class="room-inspector-modal hidden">
            <div class="inspector-header">
                <div>
                    <span id="room-type-tag" class="room-type-pill">CLASSROOM</span>
                    <h3 id="room-title">CSA-4</h3>
                </div>
                <button type="button" id="close-card-btn" class="btn-close-inspector" aria-label="Close Inspector">✕</button>
            </div>
            <div class="inspector-body">
                <p id="room-description">Standard lecture hall facility equipped with digital teaching tools.</p>
            </div>
        </section>
    </main>

    <script src="js/building.js"></script>
</body>
</html>
