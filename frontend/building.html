<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Building Layout - GIET Campus Guide</title>

    <link rel="icon" type="image/png" href="assets/images/LOGO.png">
    <link rel="shortcut icon" type="image/png" href="assets/images/LOGO.png">
    <link rel="apple-touch-icon" href="assets/images/LOGO.png">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/building.css">
</head>
<body class="building-body">

    <!-- 1. TOP APPLICATION BAR -->
    <header class="app-header">
        <div class="nav-col-left">
            <a href="navigation.html" class="btn-nav-action" title="Back to Campus Map">
                <i class="fa-solid fa-arrow-left"></i>
                <span class="nav-text-desktop">Campus Map</span>
            </a>
        </div>
        
        <div class="nav-col-center">
            <div class="brand-unit">
                <div class="brand-icon-box">
                    <img src="assets/images/LOGO.png" alt="GIET" onerror="this.style.display='none'">
                </div>
                <div class="brand-title-wrap">
                    <span class="brand-title-main" id="building-header-name">CSA Block</span>
                    <span class="brand-title-sub">FLOOR NAVIGATION</span>
                </div>
            </div>
        </div>

        <div class="nav-col-right">
            <button type="button" class="btn-nav-action btn-icon-round" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
                <i class="fa-solid fa-moon"></i>
            </button>
            <a href="admin.html" class="btn-nav-action nav-desktop-only" title="Admin Studio">
                <i class="fa-solid fa-gear"></i>
                <span>Admin</span>
            </a>
            <a href="index.html" class="btn-nav-action nav-desktop-only" title="Home">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
        </div>
    </header>

    <main class="layout-stage">
        <!-- 2. CONTROLS: CUSTOM BUILDING SELECTOR & SEARCH -->
        <section class="selector-bar">
            <div class="control-item building-select-container">
                <button type="button" id="building-picker-trigger" class="custom-select-trigger" aria-label="Select Building">
                    <i class="fa-solid fa-building select-icon"></i>
                    <span id="selected-building-label">CSA Block</span>
                    <i class="fa-solid fa-chevron-down select-arrow"></i>
                </button>
            </div>

            <div class="control-item search-container">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="room-search-input" class="common-search-input" placeholder="Search room, corridor, or lab..." autocomplete="off">
            </div>
        </section>

        <!-- 3. FLOOR TABS -->
        <section class="floor-switch-strip" id="floor-tabs-container">
            <!-- Dynamically populated from database floors -->
        </section>

        <!-- 4. ARCHITECTURAL BOARD CONTAINER -->
        <section class="blueprint-card-frame">
            <div class="frame-top-meta">
                <span id="current-floor-label" class="floor-title-display">CSA Block - Third Floor</span>
                
                <!-- INTERACTIVE CATEGORY LEGEND BAR -->
                <div class="legend-group" id="blueprint-legend-group">
                    <button type="button" class="legend-badge active" data-category="all">All</button>
                    <button type="button" class="legend-badge" data-category="classroom">
                        <span class="legend-dot dot-class"></span> Class
                    </button>
                    <button type="button" class="legend-badge" data-category="laboratory">
                        <span class="legend-dot dot-lab"></span> Lab
                    </button>
                    <button type="button" class="legend-badge" data-category="office">
                        <span class="legend-dot dot-office"></span> Office
                    </button>
                    <button type="button" class="legend-badge" data-category="corridor">
                        <span class="legend-dot dot-corridor"></span> Walkway
                    </button>
                    <button type="button" class="legend-badge" data-category="stairs">
                        <span class="legend-dot dot-stairs"></span> Stairs/Lift
                    </button>
                    <button type="button" class="legend-badge" data-category="utility">
                        <span class="legend-dot dot-utility"></span> Washroom/Water
                    </button>
                </div>
            </div>

            <!-- PINNED FLOATING ZOOM TOOLBAR (Direct child of card frame) -->
            <div class="blueprint-zoom-toolbar">
                <button type="button" id="btn-zoom-in" title="Zoom In"><i class="fa-solid fa-plus"></i></button>
                <button type="button" id="btn-zoom-reset" title="Fit to Screen"><i class="fa-solid fa-compress"></i></button>
                <button type="button" id="btn-zoom-out" title="Zoom Out"><i class="fa-solid fa-minus"></i></button>
            </div>

            <!-- TOUCH VIEWPORT CANVAS -->
            <div class="blueprint-canvas-scroll" id="blueprint-viewport">
                <div id="blueprint-board" class="blueprint-grid-board">
                    <!-- Rooms rendered from DB coordinates (x, y, w, h) -->
                </div>
            </div>
        </section>

        <!-- 5. ROOM DETAIL BOTTOM INSPECTOR CARD -->
        <section id="room-detail-card" class="room-inspector-modal hidden">
            <div class="inspector-header">
                <div>
                    <span id="room-type-tag" class="room-type-pill">CLASSROOM</span>
                    <h3 id="room-title">CSA-4</h3>
                </div>
                <button type="button" id="close-card-btn" class="btn-close-inspector" aria-label="Close Inspector">✕</button>
            </div>
            <div class="inspector-body">
                <p id="room-description">Standard lecture hall facility equipped with digital teaching tools.</p>
            </div>
            <a href="navigation.html" class="btn-return-map-route">
                <i class="fa-solid fa-location-dot"></i> Back to Outdoor Navigation
            </a>
        </section>
    </main>

    <!-- 6. MODAL BOTTOM SHEET BUILDING PICKER -->
    <div id="building-modal-sheet" class="building-sheet-modal hidden">
        <div class="sheet-backdrop" id="sheet-backdrop"></div>
        <div class="sheet-card">
            <div class="sheet-header">
                <div class="sheet-handle-bar"></div>
                <div class="sheet-title-row">
                    <h4>Select Campus Building</h4>
                    <button type="button" id="btn-close-sheet" class="btn-sheet-close">✕</button>
                </div>
            </div>
            <div class="sheet-search-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="sheet-building-search" placeholder="Filter buildings..." autocomplete="off">
            </div>
            <div class="sheet-list" id="building-options-list">
                <!-- Options populated dynamically by building.js -->
            </div>
        </div>
    </div>

    <script src="js/building.js"></script>
</body>
</html>
