<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Navigator - GIET University</title>

    <!-- Leaflet Core CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="navigation.css" />
</head>
<body>

    <!-- FULLSCREEN ANIMATED LOADER -->
    <div id="loading-screen" class="loading-screen">
        <div class="loader-content">
            <div class="spinner"></div>
            <h3>Loading Campus Navigator...</h3>
            <p>Fetching buildings, walkways, and high-res satellite imagery</p>
        </div>
    </div>

    <!-- TOP NAVBAR -->
    <header class="header">
        <div class="logo-section">
            <a href="index.html" class="logo-link">
                <img src="logo.jpeg" class="logo" alt="GIET Logo" />
                <h2>GIET Campus Guide</h2>
            </a>
        </div>
        <nav class="navbar">
            <a href="index.html">← Back to Home</a>
        </nav>
    </header>

    <!-- MAP CANVAS & FLOATING BOTTOM-SHEET PANEL -->
    <main class="map-section">
        <!-- Floating Navigation Control Card -->
        <aside id="nav-panel" class="nav-panel">
            <!-- Mobile Toggle / Drag Pill -->
            <button id="toggle-panel-btn" class="panel-toggle-btn" aria-label="Toggle Panel">
                <span class="toggle-bar"></span>
            </button>

            <div class="nav-panel-header">
                <h3>Find Route</h3>
                <span class="badge">Satellite Live</span>
            </div>

            <div class="panel-body">
                <div class="input-group">
                    <label for="start-select">Starting Point</label>
                    <select id="start-select">
                        <option value="">Choose Starting Location</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="end-select">Destination</label>
                    <select id="end-select">
                        <option value="">Choose Destination</option>
                    </select>
                </div>

                <!-- Route Actions -->
                <div class="action-buttons">
                    <button id="find-route-btn" class="btn btn-primary">Find Route</button>
                    <button id="clear-route-btn" class="btn btn-secondary">Clear</button>
                </div>

                <!-- Navigation & Simulation Actions -->
                <div class="action-buttons">
                    <button id="start-nav-btn" class="btn btn-gps">🚶 GPS Live</button>
                    <button id="simulate-btn" class="btn btn-simulate">▶️ Simulate Walk</button>
                </div>

                <div id="route-output" class="route-output"></div>
            </div>
        </aside>

        <!-- Leaflet Map Canvas -->
        <div id="map"></div>
    </main>

    <!-- Leaflet JS & App Script -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="navigation.js"></script>
</body>
</html>
