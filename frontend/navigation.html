<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Navigator - GIET University</title>

    <!-- Leaflet Core CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/navigation.css" />
</head>
<body>

    <!-- FULLSCREEN ANIMATED LOADER -->
    <div id="loading-screen" class="loading-screen">
        <div class="loader-content">
            <div class="spinner"></div>
            <h3>Loading Campus Navigator...</h3>
            <p>Fetching buildings, walkways, and high-res satellite imagery</p>
        </div>
    </div>

    <!-- TOP NAVBAR -->
    <header class="header">
        <div class="logo-section">
            <a href="index.html" class="logo-link">
                <img src="assets/images/LOGO.png" class="logo" alt="GIET Logo" />
                <h2>GIET Campus Guide</h2>
            </a>
        </div>
        <nav class="navbar">
            <a href="index.html">← Back to Home</a>
        </nav>
    </header>

    <!-- MAP CANVAS & FLOATING BOTTOM-SHEET PANEL -->
    <main class="map-section">
        <!-- Floating Navigation Control Card -->
        <aside id="nav-panel" class="nav-panel">
            <!-- Mobile Toggle / Drag Pill -->
            <button id="toggle-panel-btn" class="panel-toggle-btn" aria-label="Toggle Panel">
                <span class="toggle-bar"></span>
            </button>

            <div class="nav-panel-header">
                <h3>Find Routes</h3>
                <span class="badge">Satellite Live</span>
            </div>

            <div class="panel-body">
                <!-- Live Search Box for Buildings / Places -->
                <div class="search-container">
                    <input type="text" id="building-search" class="search-input" placeholder="🔍 Search buildings, labs, gates..." autocomplete="off" />
                    <div id="search-results" class="search-results-dropdown"></div>
                </div>

                <!-- Dynamic Waypoints Container -->
                <div id="waypoints-container">
                    <div class="input-group stop-row">
                        <select class="location-select" data-stop="0">
                            <option value="">Choose Starting Point</option>
                        </select>
                    </div>
                    <div class="input-group stop-row">
                        <select class="location-select" data-stop="1">
                            <option value="">Choose Destination</option>
                        </select>
                    </div>
                </div>

                <button type="button" id="add-stop-btn" class="btn-add-stop">
                    ➕ Next destination
                </button>

                <!-- Route Actions -->
                <div class="action-buttons">
                    <button id="find-route-btn" class="btn btn-primary">Find Routes</button>
                    <button id="clear-route-btn" class="btn btn-secondary">Clear</button>
                </div>

                <!-- Google Maps Alternative Route Selector Cards -->
                <div id="route-options-container" style="display: none; margin-top: 10px;">
                    <p style="font-size: 11px; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 6px;">
                        Suggested Routes (Click to switch):
                    </p>
                    <div id="route-cards-list"></div>
                </div>

                <!-- Navigation & Simulation Actions -->
                <div class="action-buttons">
                    <button id="start-nav-btn" class="btn btn-gps">🚶 GPS Live</button>
                    <button id="simulate-btn" class="btn btn-simulate">▶️ Simulate Walk</button>
                </div>

                <div id="route-output" class="route-output"></div>
            </div>
        </aside>

        <!-- Leaflet Map Canvas -->
        <div id="map"></div>
    </main>

    <!-- Leaflet JS & App Script -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/navigation.js"></script>
</body>
</html>
