<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GIET Campus Guide - Live Navigator</title>

    <link rel="icon" type="image/png" href="assets/images/LOGO.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/navigation.css" />
</head>
<body class="nav-body">

    <!-- FLOATING TOP BAR WITH UTILITY TOGGLES -->
    <header class="header nav-header">
        <a href="index.html" class="logo-section nav-brand">
            <img src="assets/images/LOGO.png" alt="GIET Logo" class="logo brand-logo" />
            <div class="brand-text">
                <span class="brand-main">GIET Campus Guide</span>
                <span class="brand-status"><span class="status-dot"></span> Live Navigator</span>
            </div>
        </a>

        <!-- UTILITY OVERLAY FILTER CHIPS -->
        <div class="header-controls">
            <div class="utility-chips-group">
                <button type="button" class="util-chip" data-type="water" title="Drinking Water">🚰 Water</button>
                <button type="button" class="util-chip" data-type="washroom" title="Restrooms">🚻 Restrooms</button>
                <button type="button" class="util-chip" data-type="medical" title="First Aid / Medical">🏥 Medical</button>
                <button type="button" class="util-chip" data-type="security" title="Security / Gate">🛡️ Security</button>
            </div>
            <a href="index.html" class="btn-back navbar"><i class="fa-solid fa-arrow-left"></i> Home</a>
        </div>
    </header>

    <!-- LIVE TURN-BY-TURN HUD (Appears when walking) -->
    <div id="turn-by-turn-hud" class="turn-hud hidden">
        <div class="turn-icon" id="turn-icon">⬆️</div>
        <div class="turn-details">
            <div class="turn-instruction" id="turn-instruction">Follow the path ahead</div>
            <div class="turn-distance" id="turn-distance">in 25 meters</div>
        </div>
        <button type="button" id="exit-nav-btn" class="btn-exit-hud" title="Exit Navigation">✕</button>
    </div>

    <!-- MAIN LEAFLET MAP CONTAINER -->
    <div id="map"></div>

    <!-- ROUTING & NAVIGATION PANEL -->
    <section class="nav-panel" id="nav-panel">
        <div class="panel-handle-area">
            <button class="panel-toggle-btn" id="toggle-panel-btn" aria-label="Toggle Panel">
                <span class="handle-bar toggle-bar"></span>
            </button>
        </div>

        <div class="panel-body">
            <!-- Search & Waypoints -->
            <div class="search-section search-container">
                <div class="search-input-wrapper">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="building-search" class="search-input" placeholder="Search buildings, amenities, gates..." autocomplete="off" />
                    <div id="search-results" class="search-dropdown search-results-dropdown hidden"></div>
                </div>
            </div>

            <!-- Start / Destination Selectors -->
            <div class="waypoints-container" id="waypoints-container">
                <div class="input-group">
                    <div class="point-badge start-badge">A</div>
                    <select class="location-select" id="start-select">
                        <option value="LIVE_LOCATION">📍 My Live Location (GPS)</option>
                    </select>
                </div>

                <div class="input-group">
                    <div class="point-badge end-badge">B</div>
                    <select class="location-select" id="destination-select"></select>
                </div>
            </div>

            <button type="button" id="add-stop-btn" class="btn-link btn-add-stop">
                <i class="fa-solid fa-plus"></i> Add Next Destination
            </button>

            <!-- Actions -->
            <div class="btn-grid action-buttons">
                <button type="button" id="find-route-btn" class="btn btn-primary">
                    <i class="fa-solid fa-route"></i> Find Routes
                </button>
                <button type="button" id="clear-route-btn" class="btn btn-secondary">
                    Clear
                </button>
            </div>

            <div class="btn-grid live-grid action-buttons">
                <button type="button" id="start-nav-btn" class="btn btn-gps">
                    <i class="fa-solid fa-location-arrow"></i> <span>Start Live GPS</span>
                </button>
                <button type="button" id="simulate-btn" class="btn btn-sim">
                    <i class="fa-solid fa-play"></i> <span>Simulate Walk</span>
                </button>
            </div>

            <!-- Turn List / Steps Container -->
            <div id="route-output" class="route-output hidden"></div>
            <div id="route-options-container" class="route-options-container hidden">
                <h4 class="section-title">Suggested Corridors</h4>
                <div id="route-cards-list" class="route-cards-list"></div>
            </div>

            <div id="turn-steps-container" class="turn-steps-container hidden">
                <h4 class="section-title">Turn-by-Turn Directions</h4>
                <div id="turn-steps-list" class="turn-steps-list"></div>
            </div>
        </div>
    </section>

    <!-- LOADING SCREEN -->
    <div id="loading-screen" class="loading-overlay loading-screen">
        <div class="loading-content loader-content">
            <div class="spinner"></div>
            <h3>Loading GIET Campus Spatial Mesh...</h3>
            <p>Acquiring satellite paths and campus amenities</p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/navigation.js"></script>
</body>
</html>
